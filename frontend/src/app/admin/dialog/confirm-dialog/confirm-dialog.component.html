<h1 mat-dialog-title>Do you want to delete this row?</h1>
<div mat-dialog-content>
  </div>
<div mat-dialog-actions>
  <button mat-raised-button color="primary" [mat-dialog-close]="true" (click)="confirmDelete()">OK</button>
  <button mat-raised-button color="accent" (click)="onNoClick()"  tabindex="" x="-1">Cancel</button>
</div>
